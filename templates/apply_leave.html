<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply for Leave | LeaveFlow</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='apply_leave_style.css') }}">
</head>

<body class="apply-body">

    <!-- NAVIGATION BAR -->
    <header class="apply-navbar">

        <div class="apply-navbar-logo">
            <span class="apply-navbar-icon">L</span>
            <span>LeaveFlow</span>
        </div>

        <span class="apply-navbar-label">
            Employee Portal
        </span>

    </header>

    <!-- MAIN CONTENT -->
    <main class="apply-page">

        <div class="apply-heading">

            <a href="{{ url_for('home') }}" class="apply-back">
                ← Back to Dashboard
            </a>

            <h1>Apply for Leave</h1>

            <p>
                Submit a new leave application by completing
                the form below.
            </p>

        </div>

        <!-- FORM CARD -->
        <section class="apply-card">

            <div class="apply-card-header">
                <h2>Leave Application Form</h2>
                <p>Please provide the required information.</p>
            </div>

            <form action="{{ url_for('apply_leave') }}" method="POST" class="apply-form">

                <!-- EMPLOYEE ID -->
                <div class="apply-field">

                    <label for="employee_id">
                        Employee ID
                    </label>

                    <input type="number" id="employee_id" name="employee_id" placeholder="Enter your employee ID"
                        min="1" required>

                </div>

                <!-- LEAVE TYPE -->
                <div class="apply-field">

                    <label for="leave_type">
                        Leave Type
                    </label>

                    <select id="leave_type" name="leave_type" required>
                        <option value="" disabled selected>
                            Select leave type
                        </option>

                        <option value="Paid Leave">
                            Paid Leave
                        </option>

                        <option value="Sick Leave">
                            Sick Leave
                        </option>

                        <option value="Casual Leave">
                            Casual Leave
                        </option>
                    </select>

                </div>

                <!-- DATE FIELDS -->
                <div class="apply-date-row">

                    <div class="apply-field">

                        <label for="start_date">
                            Start Date
                        </label>

                        <input type="date" id="start_date" name="start_date" required>

                    </div>

                    <div class="apply-field">

                        <label for="end_date">
                            End Date
                        </label>

                        <input type="date" id="end_date" name="end_date" required>

                    </div>

                </div>

                <!-- REASON -->
                <div class="apply-field">

                    <label for="reason">
                        Reason for Leave
                    </label>

                    <textarea id="reason" name="reason" rows="5"
                        placeholder="Briefly explain your reason for requesting leave..." required></textarea>

                </div>

                <!-- BUTTONS -->
                <div class="apply-actions">

                    <a href="{{ url_for('home') }}" class="apply-cancel-btn">
                        Cancel
                    </a>

                    <button type="submit" class="apply-submit-btn">
                        Submit Application
                    </button>

                </div>

            </form>

        </section>

    </main>

    <!-- FOOTER -->
    <footer class="apply-footer">
        <p>
            © 2026 LeaveFlow · Employee Leave Management System
        </p>
    </footer>

</body>

</html>

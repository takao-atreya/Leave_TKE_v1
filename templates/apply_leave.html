<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Leave | LeaveFlow</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='apply_leave_style.css') }}">
</head>

<body>

    <header class="navbar">
        <div class="logo">
            <span class="logo-icon">L</span>
            <span>LeaveFlow</span>
        </div>
        <span class="nav-label">Employee Portal</span>
    </header>

    <main class="form-page">

        <div class="form-header">
            <a href="{{ url_for('home') }}" class="back-link">
                ← Back to Dashboard
            </a>

            <h1>Apply for Leave</h1>
            <p>Fill in the details below to submit your leave application.</p>
        </div>

        <div class="form-card">

            <div class="form-card-heading">
                <h2>Leave Application</h2>
                <p>Please provide accurate information for your request.</p>
            </div>

            <form action="{{ url_for('apply_leave') }}" method="POST">

                <div class="form-group">
                    <label for="employee_id">Employee ID <span>*</span></label>
                    <input type="number" id="employee_id" name="employee_id" placeholder="Enter your employee ID"
                        min="1" required>
                </div>

                <div class="form-group">
                    <label for="leave_type">Leave Type <span>*</span></label>
                    <select id="leave_type" name="leave_type" required>
                        <option value="">Select leave type</option>
                        <option value="Paid Leave">Paid Leave</option>
                        <option value="Sick Leave">Sick Leave</option>
                        <option value="Casual Leave">Casual Leave</option>
                    </select>
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="start_date">Start Date <span>*</span></label>
                        <input type="date" id="start_date" name="start_date" required>
                    </div>

                    <div class="form-group">
                        <label for="end_date">End Date <span>*</span></label>
                        <input type="date" id="end_date" name="end_date" required>
                    </div>

                </div>

                <div class="form-group">
                    <label for="reason">Reason for Leave <span>*</span></label>
                    <textarea id="reason" name="reason" rows="5"
                        placeholder="Briefly explain the reason for your leave..." required></textarea>
                </div>

                <div class="form-actions">
                    <a href="{{ url_for('home') }}" class="cancel-button">
                        Cancel
                    </a>

                    <button type="submit" class="submit-button">
                        Submit Application →
                    </button>
                </div>

            </form>
        </div>

    </main>

    <footer class="footer">
        <p>© 2026 LeaveFlow · Employee Leave Management System</p>
    </footer>

</body>

</html>
